plugins {
    id 'com.android.application'
}

android {
    namespace 'com.customer.recorder'
    compileSdk 34

    defaultConfig {
        applicationId 'com.customer.recorder'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '2.4'
    }

    // 固定签名，保证以后的新版本能直接覆盖安装、不丢数据
    signingConfigs {
        fixed {
            storeFile file('app.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    lint {
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            if (project.hasProperty('shotDir')) systemProperty 'shotDir', project.property('shotDir')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}
