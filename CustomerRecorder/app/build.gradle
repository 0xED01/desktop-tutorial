plugins {
    id 'com.android.application'
}

android {
    namespace 'com.customer.recorder'
    compileSdk 34

    defaultConfig {
        applicationId 'com.customer.recorder'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // 固定签名，保证以后的新版本能直接覆盖安装、不丢数据
    signingConfigs {
        fixed {
            storeFile file('app.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
