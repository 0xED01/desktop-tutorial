plugins {
    id 'com.android.application'
}

android {
    namespace 'com.trustnothing.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.trustnothing.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' } // no native code; kept for clarity
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // For a store release, configure your own signingConfig here.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    aaptOptions {
        noCompress 'ogg', 'js', 'html'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
