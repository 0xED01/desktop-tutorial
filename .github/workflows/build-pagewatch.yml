name: Build PageWatch

on:
  push:
    branches: ["**"]
    paths:
      - "pagewatch/**"
      - ".github/workflows/build-pagewatch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Test and build APK
        working-directory: pagewatch
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: cp pagewatch/app/build/outputs/apk/release/app-release.apk PageWatch-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PageWatch-Android-${{ env.VERSION_NAME }}
          path: PageWatch-Android.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pagewatch-v${{ env.VERSION_NAME }}
          name: 网页有货监控（安卓） v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            用手机浏览器下载 **PageWatch-Android.apk**，点击安装（需要允许“安装未知来源应用”）。
            使用说明见仓库 README 的「网页有货监控」部分。
          files: PageWatch-Android.apk
