name: Build IslandPet

on:
  push:
    paths:
      - "IslandPet/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: IslandPet
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: IslandPet
        run: |
          xcodebuild -version
          xcodebuild \
            -project IslandPet.xcodeproj \
            -scheme IslandPet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -80; tail -40 build.log; exit 1; }
          grep -E "BUILD SUCCEEDED" build.log

      - name: Package unsigned IPA
        working-directory: IslandPet
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IslandPet.app Payload/
          zip -qry IslandPet-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IslandPet-unsigned-ipa
          path: IslandPet/IslandPet-unsigned.ipa
