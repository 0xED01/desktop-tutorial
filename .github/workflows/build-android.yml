# 在 GitHub Actions 上用 GameCI 构建安卓 APK（手动触发）。
# 需要先在仓库 Settings → Secrets 中配置 Unity 授权：
#   UNITY_LICENSE（.ulf 文件全文）、UNITY_EMAIL、UNITY_PASSWORD
# 说明见 https://game.ci/docs/github/activation
name: Build Android APK

on:
  workflow_dispatch:
  # 修改 .github/build-trigger 并推送即可触发一次构建（无需先合并到默认分支）
  push:
    paths:
      - '.github/build-trigger'

jobs:
  build:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: OfficeExplorer.EditorTools.BuildScript.BuildAndroid
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: OfficeExplorer-Android
          path: |
            Builds/Android/*.apk
            build/**/*.apk
          if-no-files-found: error
