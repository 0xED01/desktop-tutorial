name: Build Windows

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: |
          python test_core.py
          $env:ASM_SMOKE_TEST = "1"
          python apple_stock_monitor.py

      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name AppleStockMonitor apple_stock_monitor.py

      - name: Build installer
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: AppleStockMonitor-${{ env.APP_VERSION }}
          path: |
            Output/AppleStockMonitor-Setup.exe
            dist/AppleStockMonitor.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 苹果库存监控 v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            下载 **AppleStockMonitor-Setup.exe** 双击安装（推荐），或下载 **AppleStockMonitor.exe** 免安装直接运行。
            使用说明见仓库 README。
          files: |
            Output/AppleStockMonitor-Setup.exe
            dist/AppleStockMonitor.exe
