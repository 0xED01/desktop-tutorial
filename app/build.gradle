plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sleepwell.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sleepwell.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        // 固定签名，保证以后的新版本可以直接覆盖安装
        release {
            storeFile file('anshui.jks')
            storePassword 'anshui123'
            keyAlias 'anshui'
            keyPassword 'anshui123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

android.testOptions.unitTests.includeAndroidResources = true

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
