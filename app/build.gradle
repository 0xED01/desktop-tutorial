plugins {
    id 'com.android.application'
}

android {
    namespace 'com.textshortcut.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.textshortcut.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 使用调试签名，生成的 APK 可直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
