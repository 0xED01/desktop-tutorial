<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5fa">
<title>钱来账本</title>
<style>
:root{
  --bg:#f4f5fa; --card:#fff; --text:#1c1f2a; --sub:#848a9c; --line:#eceef4;
  --pri:#4f46e5; --pri2:#7c3aed; --pri-soft:#eef0ff; --gold:#f5b301;
  --warn:#e07b00; --warn-soft:#fff3e0; --red:#f04438; --green:#12b76a; --chip:#f2f3f8;
  --blue:#2e90fa; --blue-soft:#eaf3ff; --violet:#7a5af8; --violet-soft:#f1edff; --ok:#079455; --ok-soft:#e7f8ef;
  --shadow:0 1px 2px rgba(20,24,40,.04),0 6px 20px rgba(20,24,40,.06);
  --up:var(--red); --down:var(--green);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1117; --card:#191c25; --text:#e9ebf1; --sub:#9097a8; --line:#262a36;
    --pri:#7c74ff; --pri2:#a274ff; --pri-soft:#24244a; --warn:#f5a524; --warn-soft:#3a2c14;
    --red:#ff6b61; --green:#3ddc97; --chip:#232733;
    --blue:#5aa9ff; --blue-soft:#18263d; --violet:#a48bff; --violet-soft:#29224a; --ok:#3ddc97; --ok-soft:#123326;
    --shadow:0 0 0 1px var(--line);
  }
}
body.green-up{ --up:var(--green); --down:var(--red); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}

/* 顶栏 & 导航 */
header{position:sticky;top:0;z-index:5;background:var(--bg)}
header .wrap{display:flex;align-items:center;gap:10px;height:58px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:32px;height:32px;flex:none}
.logo b{font-size:18px;letter-spacing:.5px}
.logo small{display:block;font-size:11px;color:var(--sub);font-weight:400;line-height:1.1}
nav.tabs{display:flex;gap:2px;margin-left:auto;align-items:center}
nav.tabs button{border:0;background:none;padding:7px 14px;border-radius:10px;color:var(--sub);display:flex;align-items:center;gap:6px;font-size:14px}
nav.tabs button svg{width:18px;height:18px}
nav.tabs button.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
nav.tabs .plus{display:none}
.fab{position:fixed;right:24px;bottom:28px;z-index:6;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:30px;padding:14px 24px;font-size:16px;font-weight:600;box-shadow:0 10px 24px rgba(79,70,229,.35);display:flex;align-items:center;gap:6px}
@media (max-width:640px){
  body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
  header .wrap{height:54px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;gap:0;background:var(--card);box-shadow:0 -1px 0 var(--line),0 -6px 20px rgba(20,24,40,.05);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:8}
  nav.tabs button{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:4px 0;border-radius:0}
  nav.tabs button.on{background:none}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs .plus{display:flex;flex:none;width:52px;height:52px;margin:-22px 6px 0;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(79,70,229,.4)}
  nav.tabs .plus svg{width:26px;height:26px}
  .fab{display:none}
}
main{padding:8px 0 16px}

/* 卡片 */
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:400;font-size:12px;color:var(--sub)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(4,1fr);margin-bottom:12px}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);position:relative}
.stat[data-act]{cursor:pointer}
.stat[data-act]::after{content:'›';position:absolute;right:12px;top:10px;color:var(--sub);font-size:18px}
.stat .k{color:var(--sub);font-size:12px;display:flex;align-items:center;gap:6px}
.stat .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat .v{font-size:21px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-all;letter-spacing:-.3px}
.stat .s{color:var(--sub);font-size:12px;margin-top:2px}
.pos{color:var(--up)} .neg{color:var(--down)} .muted{color:var(--sub)} .warn{color:var(--warn)}

/* 首页大卡片 */
.hero{background:linear-gradient(135deg,var(--pri) 0%,var(--pri2) 100%);color:#fff;border-radius:22px;padding:18px 18px 16px;margin-bottom:12px;box-shadow:0 14px 30px rgba(79,70,229,.28);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::after{content:'';position:absolute;right:50px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero>*{position:relative;z-index:1}
.hero .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .lbl{opacity:.85;font-size:13px}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums;line-height:1.15}
.hero .sub{opacity:.8;font-size:12px}
.hero .row3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
.hero .row3 div{font-size:11px;opacity:.85}
.hero .row3 b{display:block;font-size:16px;opacity:1;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;background:rgba(255,255,255,.16);border-radius:20px;padding:3px;margin-left:auto}
.pill button{border:0;background:none;color:#fff;opacity:.8;padding:3px 10px;border-radius:16px;font-size:12px}
.pill button.on{background:#fff;color:var(--pri);opacity:1;font-weight:600}

/* 待处理 */
.todo .ti{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.todo .ti:first-of-type{border-top:0}
.todo .ti .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.todo .ti .tx{flex:1;min-width:0}
.todo .ti .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .ti .tx small{color:var(--sub);font-size:12px}
.todo .more{display:block;text-align:center;color:var(--pri);font-size:13px;padding-top:8px;border-top:1px solid var(--line);margin-top:2px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}

/* 控件 */
.seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:9px;color:var(--sub);font-size:13px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabsx{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.tabsx::-webkit-scrollbar{display:none}
.tabsx button{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--sub);white-space:nowrap;flex:none}
.tabsx button small{margin-left:3px;opacity:.75}
.tabsx button.on{background:var(--text);color:var(--card);font-weight:600}
.tabsx button.hot:not(.on){color:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--sub)}
.toolbar .search input{padding-left:36px}
input,select,textarea{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;font-size:15px;transition:border-color .15s}
.toolbar input,.toolbar select{font-size:14px;padding:8px 10px}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.filters{display:flex;gap:8px;flex:1 1 300px}
.filters>*{flex:1;min-width:0}
.btn{border:1.5px solid var(--line);background:var(--card);padding:8px 16px;border-radius:12px;white-space:nowrap;font-size:14px;font-weight:500}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent;color:#fff;font-weight:600}
.btn.soft{background:var(--pri-soft);border-color:transparent;color:var(--pri);font-weight:600}
.btn.okb{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 12px;font-size:12px;border-radius:10px}
.btn.lg{padding:12px 20px;font-size:16px;border-radius:14px}
.empty{text-align:center;color:var(--sub);padding:36px 0}
.empty .e{font-size:44px;margin-bottom:6px}

/* 列表 */
.item{display:flex;gap:12px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start;transition:background .15s}
.item:first-child{border-top:0}
.item:active{background:var(--chip)}
.av{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none}
.b-transit{background:var(--blue-soft);color:var(--blue)}
.b-stock{background:var(--warn-soft);color:var(--warn)}
.b-listed{background:var(--violet-soft);color:var(--violet)}
.b-sold{background:var(--ok-soft);color:var(--ok)}
.b-returned{background:var(--chip);color:var(--sub)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--sub);font-weight:400}
.item .m{color:var(--sub);font-size:12px;margin-top:1px}
.item .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.item .n{text-align:right;font-variant-numeric:tabular-nums;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.item .n .p{font-weight:700;font-size:16px}
.item .n .m{margin:0}
.item .qa{display:flex;gap:6px;margin-top:4px}
.item.stale .age{color:var(--warn);font-weight:600}
.badge{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--sub);font-weight:500;white-space:nowrap}
.st-transit{background:var(--blue-soft);color:var(--blue)}
.st-stock{background:var(--warn-soft);color:var(--warn)}
.st-listed{background:var(--violet-soft);color:var(--violet)}
.st-sold{background:var(--ok-soft);color:var(--ok)}
.st-await{background:var(--warn-soft);color:var(--warn)}
.st-returned{background:var(--chip);color:var(--sub);text-decoration:line-through}
.sum{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);align-items:center;margin-bottom:6px}
.sum b{color:var(--text);font-variant-numeric:tabular-nums}
.sum .btn{margin-left:auto}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.tbl th,.tbl td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.tbl th{color:var(--sub);font-weight:500;font-size:12px}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--chip)}
.tbl tfoot td{font-weight:700;border-bottom:0}
.scroll{overflow-x:auto}

/* 横条 */
.hbar{display:grid;grid-template-columns:76px 1fr 92px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.hbar .track{background:var(--chip);border-radius:6px;height:8px;overflow:hidden}
.hbar .fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:6px}
.hbar .fill.neg{background:var(--down)}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rank{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.rank .no{width:22px;height:22px;border-radius:7px;background:var(--chip);font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none;font-weight:600}
.rank .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg text{fill:var(--sub);font-size:11px}

/* 弹窗 */
.mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,12,20,.5);z-index:20;display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.mask.on{display:flex}
.mask.show{opacity:1}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(16px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .22s ease}
.mask.show .modal{transform:none}
.modal::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
@media (min-width:641px){.mask{align-items:center}.modal{border-radius:22px;padding-top:18px}.modal::before{display:none}}
.modal h2{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
.modal h2 .x{margin-left:auto;border:0;background:var(--chip);width:30px;height:30px;border-radius:50%;font-size:18px;color:var(--sub);line-height:1;flex:none}
.f{margin-bottom:12px}
.f>label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:500}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{display:none}
.chips span{display:inline-block;padding:6px 14px;border-radius:20px;background:var(--chip);font-size:13px;border:1.5px solid transparent;transition:all .12s}
.chips input:checked+span{background:var(--pri-soft);color:var(--pri);border-color:var(--pri);font-weight:600}
.chips.paid input[value="已到账"]:checked+span{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.chips.paid input[value="待到账"]:checked+span{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.money-in{position:relative}
.money-in::before{content:'¥';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px}
.money-in input{padding-left:26px}
.big-in input{font-size:22px;font-weight:700;padding:12px 12px 12px 30px}
.big-in::before{font-size:18px}
.stepper{display:flex;align-items:stretch}
.stepper input{text-align:center;border-radius:0;border-left:0;border-right:0;min-width:0;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper button{border:1.5px solid var(--line);background:var(--chip);width:40px;font-size:18px;flex:none}
.stepper button:first-child{border-radius:12px 0 0 12px}
.stepper button:last-child{border-radius:0 12px 12px 0}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{border:0;background:var(--chip);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--sub)}
.quick button b{color:var(--text)}
.preview{background:var(--chip);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;font-size:12px;margin-bottom:12px;color:var(--sub)}
.preview b{display:block;font-size:16px;color:var(--text);font-variant-numeric:tabular-nums}
.preview b.pos{color:var(--up)} .preview b.neg{color:var(--down)}
.foot{display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--card);padding:10px 0 4px;margin-top:4px}
.foot .btn{flex:1}
@media (min-width:641px){.foot .btn{flex:none}}
.sec{background:var(--chip);border-radius:16px;padding:12px 12px 2px;margin-bottom:12px}
.sec input,.sec .stepper button{background:var(--card)}
.sec .chips span{background:var(--card)}
details.more{margin-bottom:12px}
details.more summary{cursor:pointer;color:var(--pri);font-size:13px;list-style:none;padding:4px 0 8px;font-weight:500}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{color:var(--sub)}
/* 详情 */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:14px}
.kv dt{color:var(--sub)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.kv .hr{grid-column:1/-1;border-top:1px dashed var(--line);margin:2px 0}
.kv .tot{font-weight:700;font-size:15px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts button{border:0;background:var(--chip);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--text)}
.acts button span{font-size:20px;line-height:1}
.acts button.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.acts button.g{background:var(--ok-soft);color:var(--ok)}
.acts button.d{color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(20,22,30,.92);color:#fff;padding:11px 16px;border-radius:14px;z-index:30;display:flex;gap:14px;align-items:center;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.toast button{background:none;border:0;color:#a5a0ff;font-weight:600;white-space:nowrap}
.tip{font-size:12px;color:var(--sub);margin-top:6px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;min-width:0}
.name-row .btn{display:flex;align-items:center;gap:4px;padding:0 14px;flex:none}
.pick-list{max-height:60vh;overflow:auto;margin:0 -4px}
.pick{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.pick:first-child{border-top:0}
.pick:active{background:var(--chip)}
.pick .tx{flex:1;min-width:0}
.pick .tx div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .tx small{color:var(--sub);font-size:12px}
.exp-i{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exp-i:first-child{border-top:0}
.exp-i .tx{flex:1;min-width:0}
.exp-i .tx small{color:var(--sub);font-size:12px;display:block}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
      <rect width="32" height="32" rx="9" fill="url(#lg)"/><circle cx="16" cy="16" r="9" fill="#f5b301"/><circle cx="16" cy="16" r="7" fill="none" stroke="#d48f00" stroke-width="1"/>
      <path d="M12.5 10.5 16 15l3.5-4.5M16 15v6.5M13 16.2h6M13 18.8h6" fill="none" stroke="#7a4b00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b>钱来账本</b><small id="hdrSub"></small></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>概览</span></button>
    <button data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg><span>货单</span></button>
    <button class="plus" data-v="add" aria-label="记一单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-v="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg><span>月报</span></button>
    <button data-v="exp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></svg><span>杂费</span></button>
    <button data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>设置</span></button>
  </nav>
</div></header>
<main class="wrap" id="main"></main>
<button class="fab" id="fab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>记一单</button>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="mask" id="mask2" style="z-index:25"><div class="modal" id="modal2"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script>
'use strict';
// ---------- 数据 ----------
const KEY = 'luhuo.v1';   // 存储键名沿用旧版，升级后数据不丢
const STATUS = {transit:'在途', stock:'在库', listed:'已上架', sold:'已售出', returned:'已退货'};
const DEF_SET = {
  buyPlats:['淘宝','天猫','京东','拼多多','抖音','唯品会','得物','其他'],
  sellPlats:['闲鱼','转转','得物','拼多多','线下','其他'],
  fees:{}, staleDays:30, greenUp:false,
  expTypes:['包装耗材','快递费','会员/工具','其他支出','其他收入'],
  lastSellPlat:'', paidPref:{}
};
let S = load();
function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  d = d || {};
  return {records:d.records||[], expenses:d.expenses||[], settings:Object.assign({}, DEF_SET, d.settings||{})};
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e) { toast('⚠️ 保存失败，存储不可用，请及时导出备份'); }
}

// ---------- 工具 ----------
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n*100)/100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const curMonth = () => today().slice(0,7);
const money = (n, sign) => (n<0?'-':(sign&&n>0?'+':'')) + '¥' + Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => (n<0?'-':'') + '¥' + Math.abs(n).toLocaleString('zh-CN',{maximumFractionDigits:0});
const pc = n => (n<0?'neg':n>0?'pos':'');
const pct = n => isFinite(n) ? (n*100).toFixed(1)+'%' : '—';
const days = (a,b) => Math.max(0, Math.round((new Date(b||today()) - new Date(a))/864e5));
const md = d => d ? d.slice(5) : '';
const addMonth = (m, k) => { let [y,mm] = m.split('-').map(Number); mm += k; while(mm<1){mm+=12;y--;} while(mm>12){mm-=12;y++;} return y+'-'+String(mm).padStart(2,'0'); };
const sum = (list, fn) => list.reduce((s,x) => s+fn(x), 0);

// 计算
const cost = r => r.buyPrice*r.qty + r.buyShip + r.chanFee - r.rebate;   // 到手总成本
const gross = r => r.sellPrice*r.qty;                                     // 卖出总额
const revenue = r => gross(r) - r.fee - r.sellShip;                       // 卖出实收
const profit = r => r.status==='sold' ? revenue(r) - cost(r) : 0;
const feeRate = plat => num(S.settings.fees[plat||'']) / 100;
const estProfit = r => {
  if(!r.expectPrice) return null;
  const g = r.expectPrice*r.qty;
  return g - g*feeRate(r.sellPlat) - cost(r);
};
const active = r => r.status!=='returned';
const unsold = r => ['transit','stock','listed'].includes(r.status);
const awaiting = r => r.status==='sold' && !r.paid;                      // 卖了但货款没到账
const isStale = r => unsold(r) && days(r.buyDate) >= S.settings.staleDays;

// ---------- 状态 ----------
let view = 'home';
let homeRange = 'month';
let F = {status:'unsold', q:'', plat:'', month:'', sort:'new'};
let repYear = +today().slice(0,4);

function go(v){ view = v; render(); window.scrollTo(0,0); }
$('#tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; b.dataset.v==='add' ? openForm() : go(b.dataset.v); };
$('#fab').onclick = () => openForm();

function render(){
  document.body.classList.toggle('green-up', !!S.settings.greenUp);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v===view));
  const d = new Date();
  $('#hdrSub').textContent = `${d.getMonth()+1}月${d.getDate()}日 · 周${'日一二三四五六'[d.getDay()]}`;
  $('#main').innerHTML = ({home:vHome, list:vList, report:vReport, exp:vExp, set:vSet})[view]();
  bindView();
}

// ---------- 概览 ----------
function rangeOf(k){
  const m = curMonth();
  if(k==='month') return {test:d => d && d.startsWith(m), label:'本月'};
  if(k==='last') { const l = addMonth(m,-1); return {test:d => d && d.startsWith(l), label:'上月'}; }
  if(k==='year') { const y = m.slice(0,4); return {test:d => d && d.startsWith(y), label:'今年'}; }
  return {test:d => !!d, label:'全部'};
}
function expNet(test){ // 杂费净支出
  return S.expenses.filter(e => test(e.date)).reduce((s,e) => s + (e.type==='其他收入' ? -e.amount : e.amount), 0);
}
function vHome(){
  if(!S.records.length && !S.expenses.length) return `
    <div class="hero"><div class="lbl">欢迎使用</div><div class="big">钱来账本</div><div class="sub">低买高卖，每一笔利润都记清楚</div></div>
    <div class="card empty">
      <div class="e">🪙</div>
      <p>还没有记录，点 <b>＋</b> 记下第一单</p>
      <p class="flex" style="justify-content:center"><button class="btn pri" data-act="add">记一单</button><button class="btn" data-act="demo">看看示例数据</button></p>
    </div>`;

  const R = rangeOf(homeRange);
  const sold = S.records.filter(r => r.status==='sold' && R.test(r.sellDate));
  const gp = sum(sold, profit), ex = expNet(R.test), net = gp - ex;
  const sCost = sum(sold, cost), sRev = sum(sold, gross), qty = sum(sold, r => r.qty);
  const avgDays = sold.length ? sum(sold, r => days(r.buyDate,r.sellDate))/sold.length : 0;
  const bought = S.records.filter(r => active(r) && R.test(r.buyDate));
  const inv = S.records.filter(unsold);
  const invCost = sum(inv, cost), invEst = sum(inv, r => estProfit(r)||0);
  const stale = inv.filter(isStale);
  const unpaid = S.records.filter(awaiting).sort((a,b) => a.sellDate.localeCompare(b.sellDate));
  const unpaidAmt = sum(unpaid, revenue);
  const unpaidMax = unpaid.length ? days(unpaid[0].sellDate) : 0;
  const transit = inv.filter(r => r.status==='transit').sort((a,b) => a.buyDate.localeCompare(b.buyDate));
  const wins = sold.filter(r => profit(r)>0).length;

  const months = []; for(let i=11;i>=0;i--) months.push(addMonth(curMonth(),-i));
  const series = months.map(m => {
    const t = d => d && d.startsWith(m);
    return {label: +m.slice(5)+'月', key:m, value: sum(S.records.filter(r => r.status==='sold' && t(r.sellDate)), profit) - expNet(t)};
  });
  const top = [...sold].sort((a,b) => profit(b)-profit(a)).slice(0,5);
  const loss = sold.filter(r => profit(r)<0).sort((a,b) => profit(a)-profit(b)).slice(0,5);

  // 待处理：待到账、在途、压货超期
  const todo = [
    ...unpaid.slice(0,3).map(r => `<div class="ti" data-act="detail" data-id="${r.id}"><div class="ic st-await">💰</div>
      <div class="tx"><div>${esc(r.name)}</div><small>${esc(r.sellPlat)} 卖出 · 等了 <span class="${days(r.sellDate)>=7?'warn':''}">${days(r.sellDate)} 天</span></small></div>
      <b class="num">${money(revenue(r))}</b><button class="btn okb sm" data-act="pay" data-id="${r.id}">到账</button></div>`),
    ...transit.slice(0,3).map(r => `<div class="ti" data-act="detail" data-id="${r.id}"><div class="ic st-transit">🚚</div>
      <div class="tx"><div>${esc(r.name)}${r.qty>1?` ×${r.qty}`:''}</div><small>${esc(r.buyPlat)} · 已 ${days(r.buyDate)} 天</small></div>
      <button class="btn soft sm" data-act="arrive" data-id="${r.id}">到货</button></div>`)
  ];
  const more = [
    unpaid.length>3 ? `<button class="more" data-act="goawait">全部 ${unpaid.length} 单待到账 ›</button>` : '',
    transit.length>3 ? `<button class="more" data-act="gotransit">全部 ${transit.length} 单在途 ›</button>` : '',
    stale.length ? `<button class="more" data-act="gostale" style="color:var(--warn)">⚠️ ${stale.length} 单压货超过 ${S.settings.staleDays} 天，去看看 ›</button>` : ''
  ].join('');

  return `
  <div class="hero">
    <div class="top"><span class="lbl">${R.label}净利润</span>
      <div class="pill" data-seg="homeRange">${['month','last','year','all'].map(k => `<button data-k="${k}" class="${homeRange===k?'on':''}">${rangeOf(k).label}</button>`).join('')}</div></div>
    <div class="big">${money(net,1)}</div>
    <div class="sub">卖货毛利 ${money(gp)}${ex? ` · 杂费 ${money(-ex)}`:''}</div>
    <div class="row3">
      <div>销售额<b>${money0(sRev)}</b></div>
      <div>卖出<b>${qty} 件</b></div>
      <div>利润率<b>${sCost?pct(gp/sCost):'—'}</b></div>
    </div>
  </div>

  ${todo.length||more ? `<div class="card todo"><h3>待处理 <span class="r">点按钮一键处理</span></h3>${todo.join('')}${more}</div>` : ''}

  <div class="grid">
    <div class="stat" data-act="goawait"><div class="k"><i style="background:var(--warn)"></i>待到账货款</div><div class="v">${money(unpaidAmt)}</div>
      <div class="s">${unpaid.length?`${unpaid.length} 单 · 最久 <span class="${unpaidMax>=7?'warn':''}">${unpaidMax} 天</span>`:'全部已到账 ✅'}</div></div>
    <div class="stat" data-act="goinv"><div class="k"><i style="background:var(--blue)"></i>压货资金</div><div class="v">${money(invCost)}</div>
      <div class="s">${sum(inv, r => r.qty)} 件${transit.length?` · 在途 ${transit.length} 单`:''}</div></div>
    <div class="stat"><div class="k"><i style="background:var(--violet)"></i>压货预计利润</div><div class="v ${pc(invEst)}">${money(invEst,1)}</div>
      <div class="s">按预期售价估算</div></div>
    <div class="stat"><div class="k"><i style="background:var(--pri)"></i>${R.label}进货</div><div class="v">${money(sum(bought, cost))}</div>
      <div class="s">${sum(bought, r => r.qty)} 件${bought.some(r=>r.chanFee)?` · 渠道费 ${money0(sum(bought, r => r.chanFee))}`:''}</div></div>
  </div>
  <div class="tip" style="margin:-4px 4px 12px">胜率 ${sold.length?pct(wins/sold.length):'—'} · 平均 ${sold.length?avgDays.toFixed(1):'—'} 天出手 · ${sold.length} 单</div>

  <div class="card">
    <h3>近 12 个月净利润 <span class="r">点柱子看当月明细</span></h3>
    ${barChart(series)}
  </div>
  <div class="grid2">
    <div class="card"><h3>进货平台赚了多少 <span class="r">${R.label}</span></h3>${hbars(groupProfit(sold, r => r.buyPlat))}</div>
    <div class="card"><h3>出货平台赚了多少 <span class="r">${R.label}</span></h3>${hbars(groupProfit(sold, r => r.sellPlat))}</div>
  </div>
  <div class="grid2">
    <div class="card"><h3>🏆 最赚的单 <span class="r">${R.label}</span></h3>${rankList(top)}</div>
    <div class="card"><h3>💸 亏钱的单 <span class="r">${R.label}</span></h3>${rankList(loss)}</div>
  </div>`;
}
function groupProfit(list, keyFn){
  const m = {};
  list.forEach(r => { const k = keyFn(r)||'未填'; (m[k] = m[k]||{k, v:0, n:0}); m[k].v += profit(r); m[k].n += r.qty; });
  return Object.values(m).sort((a,b) => b.v-a.v);
}
function hbars(rows){
  if(!rows.length) return '<div class="muted">暂无数据</div>';
  const max = Math.max(...rows.map(r => Math.abs(r.v)), 1);
  return rows.map(r => `<div class="hbar"><span>${esc(r.k)} <small class="muted">${r.n}件</small></span>
    <div class="track"><div class="fill ${r.v<0?'neg':''}" style="width:${Math.abs(r.v)/max*100}%"></div></div>
    <span class="val ${pc(r.v)}">${money(r.v)}</span></div>`).join('');
}
function rankList(list){
  if(!list.length) return '<div class="muted">暂无</div>';
  return list.map((r,i) => `<div class="rank" data-act="detail" data-id="${r.id}" style="cursor:pointer"><span class="no">${i+1}</span>
    <span class="tx">${esc(r.name)} <small class="muted">${esc(r.buyPlat)}→${esc(r.sellPlat)}</small></span>
    <b class="num ${pc(profit(r))}">${money(profit(r),1)}</b></div>`).join('');
}
function barChart(data){
  const W = window.innerWidth < 640 ? 360 : 640, H = 190, pt = 18, pb = 22, pl = 2;
  const vals = data.map(d => d.value);
  const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  const span = (max-min) || 1;
  const y = v => pt + (max - v) / span * (H-pt-pb);
  const bw = (W-pl) / data.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="bu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--up)"/><stop offset="1" stop-color="var(--up)" stop-opacity=".55"/></linearGradient></defs>`;
  s += `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  data.forEach((d,i) => {
    const x = pl + i*bw + bw*0.22, w = bw*0.56;
    const y0 = y(Math.max(d.value,0)), h = Math.max(Math.abs(y(d.value)-y(0)), d.value?2:0);
    const col = d.value<0 ? 'var(--down)' : 'url(#bu)';
    s += `<g data-act="month" data-m="${d.key}" style="cursor:pointer"><rect x="${pl+i*bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>`;
    s += `<rect x="${x}" y="${y0}" width="${w}" height="${h}" rx="${Math.min(5,w/2)}" fill="${col}"><title>${d.label}：${money(d.value)}</title></rect>`;
    if(d.value) s += `<text x="${x+w/2}" y="${d.value<0? y0+h+12 : y0-5}" text-anchor="middle" style="font-size:10px;font-weight:600">${Math.round(d.value)}</text>`;
    s += `<text x="${x+w/2}" y="${H-5}" text-anchor="middle">${d.label}</text></g>`;
  });
  return s + '</svg>';
}

// ---------- 货单 ----------
function filtered(){
  const q = F.q.trim().toLowerCase();
  let list = S.records.filter(r => {
    if(F.status==='unsold' && !unsold(r)) return false;
    if(F.status==='stale' && !isStale(r)) return false;
    if(F.status==='await' && !awaiting(r)) return false;
    if(!['all','unsold','stale','await'].includes(F.status) && r.status!==F.status) return false;
    if(F.plat && r.buyPlat!==F.plat && r.sellPlat!==F.plat) return false;
    if(F.month && !((r.sellDate||'').startsWith(F.month) || r.buyDate.startsWith(F.month))) return false;
    if(q && !(r.name+' '+r.cat+' '+r.note+' '+r.orderNo).toLowerCase().includes(q)) return false;
    return true;
  });
  const sorters = {
    new:(a,b) => (b.sellDate||b.buyDate).localeCompare(a.sellDate||a.buyDate) || b.created-a.created,
    old:(a,b) => a.buyDate.localeCompare(b.buyDate),
    profit:(a,b) => profit(b)-profit(a),
    cost:(a,b) => cost(b)-cost(a)
  };
  return list.sort(sorters[F.sort]);
}
function vList(){
  const list = filtered();
  const plats = [...new Set([...S.settings.buyPlats, ...S.settings.sellPlats])];
  const cnt = k => S.records.filter(k==='unsold'?unsold:k==='stale'?isStale:k==='await'?awaiting:k==='all'?()=>true:r=>r.status===k).length;
  const tabs = [['unsold','未出手'],['await','待到账'],['transit','在途'],['stock','在库'],['listed','已上架'],['sold','已售出'],['stale','压货超期'],['returned','已退货'],['all','全部']];
  const tp = sum(list, profit), tc = sum(list, cost), ta = sum(list.filter(awaiting), revenue);
  return `
  <div class="tabsx" data-seg="status">
    ${tabs.map(([k,l]) => { const n = cnt(k); return `<button data-k="${k}" class="${F.status===k?'on':''} ${(k==='await'||k==='stale')&&n?'hot':''}">${l}<small>${n}</small></button>`; }).join('')}
  </div>
  <div class="toolbar">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="搜商品、分类、备注、订单号" value="${esc(F.q)}"></div>
    <div class="filters">
      <select id="fPlat"><option value="">全部平台</option>${plats.map(p => `<option ${F.plat===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
      <input type="month" id="fMonth" value="${F.month}" title="按月份筛选">
      <select id="fSort">${[['new','最新'],['old','压最久'],['profit','最赚钱'],['cost','成本最高']].map(([k,l]) => `<option value="${k}" ${F.sort===k?'selected':''}>${l}</option>`).join('')}</select>
    </div>
    ${F.month||F.plat||F.q ? '<button class="btn sm" data-act="clearF">清除筛选</button>' : ''}
  </div>
  <div class="card">
    <div class="sum"><span>共 <b>${list.length}</b> 单</span><span>成本 <b>${money0(tc)}</b></span>
      ${list.some(r=>r.status==='sold')?`<span>利润 <b class="${pc(tp)}">${money(tp,1)}</b></span>`:''}
      ${ta?`<span>待到账 <b class="warn">${money(ta)}</b></span>`:''}
      ${F.status==='await'&&list.length?'<button class="btn okb sm" data-act="payAll">全部确认到账</button>':''}</div>
    ${list.length ? list.map(itemHtml).join('') : '<div class="empty"><div class="e">🗂️</div>没有符合条件的记录</div>'}
  </div>
  <div class="tip" style="text-align:center">点任意一单查看明细和更多操作</div>`;
}
function itemHtml(r){
  const sold = r.status==='sold', p = profit(r), ep = estProfit(r);
  const age = sold ? days(r.buyDate, r.sellDate) : days(r.buyDate);
  const meta = sold
    ? `${esc(r.buyPlat)}→${esc(r.sellPlat)} · ${md(r.sellDate)} 卖 · ${age}天`
    : `${esc(r.buyPlat)} · ${md(r.buyDate)} 买入 · <span class="age">压了 ${age} 天</span>${r.status==='listed'&&r.sellPlat?` · 挂${esc(r.sellPlat)}`:''}`;
  const qa = awaiting(r) ? `<button class="btn okb sm" data-act="pay" data-id="${r.id}">确认到账</button>`
    : r.status==='transit' ? `<button class="btn sm" data-act="arrive" data-id="${r.id}">到货</button><button class="btn soft sm" data-act="sell" data-id="${r.id}">卖出</button>`
    : unsold(r) ? `<button class="btn soft sm" data-act="sell" data-id="${r.id}">卖出</button>` : '';
  const right = sold
    ? `<div class="p ${pc(p)}">${money(p,1)}</div><div class="m">${pct(p/cost(r))}</div>`

  return `<div class="item ${isStale(r)?'stale':''}" data-act="detail" data-id="${r.id}">

    r.buyShip ? row('买入运费', money(r.buyShip)) : '',
    r.chanFee ? row('渠道费用', money(r.chanFee)) : '',

      + row('实收', money(revenue(r))) + row('货款', r.paid ? `<span class="badge st-sold">已到账 ${r.paidDate||''}</span>` : '<span class="badge st-await">待到账</span>')
      + row('利润', `${money(profit(r),1)}（${pct(profit(r)/cost(r))}）`, 'tot '+pc(profit(r))) + row('持有', days(r.buyDate, r.sellDate)+' 天') : '',
    !sold && r.expectPrice ? row('预期售价', `${money(r.expectPrice)}，预计赚 ${money(estProfit(r),1)}`) : '',

// ---------- 月报 ----------
function monthStats(m){
  const t = d => d && d.startsWith(m);
  const sold = S.records.filter(r => r.status==='sold' && t(r.sellDate));
  const bought = S.records.filter(r => active(r) && t(r.buyDate));
  const exps = S.expenses.filter(e => t(e.date));
  const o = {
    m, n: sold.length, qty: sum(sold, r => r.qty),
    sales: sum(sold, gross), cogs: sum(sold, cost), fees: sum(sold, r => r.fee+r.sellShip), gp: sum(sold, profit),
    exp: sum(exps.filter(e => e.type!=='其他收入'), e => e.amount),
    inc: sum(exps.filter(e => e.type==='其他收入'), e => e.amount),
    buy: sum(bought, cost), chan: sum(bought, r => r.chanFee), buyQty: sum(bought, r => r.qty)
  };
  o.net = o.gp - o.exp + o.inc;
  return o;
}

  const rows = []; for(let i=1;i<=12;i++) rows.push(monthStats(repYear+'-'+String(i).padStart(2,'0')));
  const T = rows.reduce((t,o) => { for(const k in o) if(typeof o[k]==='number') t[k]=(t[k]||0)+o[k]; return t; }, {});
  const show = rows.filter(o => o.n || o.buy || o.exp || o.inc || o.m <= curMonth() && o.m.startsWith(String(+today().slice(0,4))));

    <td>${o.cogs?pct(o.gp/o.cogs):'-'}</td><td>${o.qty||'-'}</td>${td(o.buy)}${td(o.chan)}<td>${o.buyQty||'-'}</td>`;

  return `
  <div class="toolbar">
    <div class="seg" data-seg="year">${years.map(y => `<button data-k="${y}" class="${y===repYear?'on':''}">${y}年</button>`).join('')}</div>

    <div class="row3">
      <div>全年销售额<b>${money0(T.sales)}</b></div>
      <div>全年进货<b>${money0(T.buy)}</b></div>
      <div>卖出 / 进货<b>${T.qty} / ${T.buyQty} 件</b></div>
    </div>
  </div>
  <div class="card"><h3>${repYear} 年每月净利润 <span class="r">点柱子看当月货单</span></h3>
    ${barChart(rows.map(o => ({label:+o.m.slice(5)+'月', key:o.m, value:o.net})))}</div>
  <div class="card"><h3>月度明细 <span class="r">点某一行看当月货单</span></h3>
    <div class="scroll"><table class="tbl">
      <thead><tr><th>月份</th><th>净利润</th><th>销售额</th><th>卖出成本</th><th>手续费+运费</th><th>卖货毛利</th><th>杂费净额</th><th>利润率</th><th>卖出件数</th><th>进货支出</th><th>其中渠道费</th><th>进货件数</th></tr></thead>
      <tbody>${show.map(o => `<tr class="click" data-act="month" data-m="${o.m}"><td>${+o.m.slice(5)}月</td>${line(o)}</tr>`).join('') || '<tr><td colspan="12" class="muted">暂无数据</td></tr>'}</tbody>
      <tfoot><tr><td>合计</td>${line(T)}</tr></tfoot>
    </table></div>
    <div class="tip">利润按<b>卖出日期</b>算进当月；卖出成本 = 买入价 × 数量 + 买入运费 + 渠道费用 − 返利；进货支出按<b>买入日期</b>统计，就是当月花出去的钱。</div>

const splitList = s => s.split(/[,，、\s]+/).map(x => x.trim()).filter(Boolean);

// ---------- 事件 ----------
function bindView(){
  const m = $('#main');
  m.querySelectorAll('[data-seg]').forEach(seg => seg.onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    e.stopPropagation();
    const k = b.dataset.k, s = seg.dataset.seg;
    if(s==='homeRange') homeRange = k;
    if(s==='status') F.status = k;
    if(s==='year') repYear = +k;
    const sx = seg.scrollLeft;
    render();
    const n = $(`[data-seg="${s}"]`); if(n) n.scrollLeft = sx;
  });
  const q = $('#q');
  if(q) {
    q.oninput = () => { F.q = q.value; const pos = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos,pos); };
    $('#fPlat').onchange = e => { F.plat = e.target.value; render(); };
    $('#fMonth').onchange = e => { F.month = e.target.value; render(); };
    $('#fSort').onchange = e => { F.sort = e.target.value; render(); };
  }
  const ef = $('#expForm');
  if(ef) ef.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(ef);
    const amount = r2(num(fd.get('amount')));
    if(amount<=0) return toast('请输入金额');
    S.expenses.push({id:uid(), type:fd.get('type'), amount, date:fd.get('date'), note:fd.get('note').trim(), created:Date.now()});
    save(); render(); toast('已记录 ✅');
  };
  const file = $('#file');
  if(file) file.onchange = () => {
    const f = file.files[0]; if(!f) return;
    f.text().then(t => {
      const d = JSON.parse(t);
      if(!Array.isArray(d.records)) throw new Error();
      if(!confirm(`导入将覆盖当前数据（备份里有 ${d.records.length} 条货单），确定吗？`)) return;
      S = {records:d.records.map(normalize), expenses:d.expenses||[], settings:Object.assign({}, DEF_SET, d.settings||{})};
      migrate(); save(); render(); toast('导入成功');
    }).catch(() => toast('文件格式不对，导入失败'));
  };
}

    listed(){ r.status = 'listed'; done(); toast('已标记上架'); },

    unpay(){ setPaid([r], false); done(); },
    payAll(){ const l = filtered().filter(awaiting); if(!confirm(`把这 ${l.length} 单共 ${money(sum(l, revenue))} 都标记为已到账？`)) return;
      setPaid(l, true); done(); toast('已全部确认到账', '撤销', () => { setPaid(l, false); save(); render(); }); },
    return(){ const old = r.status; r.status = 'returned'; r.preReturn = old; done(); toast('已标记退货，不计入统计', '撤销', () => { r.status = old; save(); render(); }); },
    unreturn(){ r.status = r.preReturn || 'stock'; done(); },
    del(){
      const i = S.records.indexOf(r); S.records.splice(i,1); done();
      toast(`已删除「${r.name}」`, '撤销', () => { S.records.splice(i,0,r); save(); render(); });
    },
    delExp(){
      const i = S.expenses.findIndex(x => x.id===id), x = S.expenses[i]; S.expenses.splice(i,1); save(); render();
      toast('已删除', '撤销', () => { S.expenses.splice(i,0,x); save(); render(); });
    },
    saveSet(){
      const st = S.settings;
      st.buyPlats = splitList($('#sBuy').value); st.sellPlats = splitList($('#sSell').value);
      st.expTypes = splitList($('#sExp').value);

      st.staleDays = Math.max(1, parseInt($('#sStale').value)||30);
      st.greenUp = $('#sColor').value==='1';
      save(); render(); toast('设置已保存');
    },
    backup(){ download(`钱来账本备份-${today()}.json`, JSON.stringify(S, null, 1), 'application/json'); },
    restore(){ $('#file').click(); },
    csv(){
      const head = ['商品','分类','数量','状态','进货平台','买入日期','买入单价','买入运费','渠道费用','返利','总成本','订单号','出货平台','卖出日期','卖出单价','手续费','卖出运费','实收','货款到账','到账日期','利润','利润率','周转天数','预期单价','备注'];
      const rows = S.records.map(r => [r.name,r.cat,r.qty,STATUS[r.status],r.buyPlat,r.buyDate,r.buyPrice,r.buyShip,r.chanFee,r.rebate,r2(cost(r)),r.orderNo,r.sellPlat,r.sellDate,
        r.status==='sold'?r.sellPrice:'', r.status==='sold'?r.fee:'', r.status==='sold'?r.sellShip:'', r.status==='sold'?r2(revenue(r)):'', r.status==='sold'?(r.paid?'已到账':'待到账'):'', r.paidDate||'', r.status==='sold'?r2(profit(r)):'',
        r.status==='sold'?pct(profit(r)/cost(r)):'', r.status==='sold'?days(r.buyDate,r.sellDate):'', r.expectPrice||'', r.note]);
      downloadCsv(`钱来货单-${today()}.csv`, [head, ...rows]);
    },
    csvMonth(){
      const head = ['月份','销售额','卖出成本','手续费+运费','卖货毛利','杂费支出','其他收入','净利润','利润率','卖出件数','进货支出','其中渠道费','进货件数'];
      const rows = []; for(let i=1;i<=12;i++){ const o = monthStats(repYear+'-'+String(i).padStart(2,'0'));
        rows.push([o.m, r2(o.sales), r2(o.cogs), r2(o.fees), r2(o.gp), r2(o.exp), r2(o.inc), r2(o.net), o.cogs?pct(o.gp/o.cogs):'', o.qty, r2(o.buy), r2(o.chan), o.buyQty]); }
      downloadCsv(`钱来月报-${repYear}.csv`, [head, ...rows]);
    },
    wipe(){ if(!confirm('确定清空全部数据？此操作不可恢复，建议先导出备份。')) return; S = {records:[], expenses:[], settings:S.settings}; save(); render(); }
  };
  if(A[el.dataset.act]) { e.stopPropagation(); A[el.dataset.act](); }
});
function download(name, text, type){
  if(window.Android && Android.saveFile) return Android.saveFile(name, type, text); // 安卓 App 内
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function downloadCsv(name, rows){
  const c = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  download(name, '﻿' + rows.map(r => r.map(c).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}

function closePicker(){ $('#mask2').classList.remove('show','on'); }
$('#mask2').addEventListener('click', e => { if(e.target.id==='mask2' || e.target.closest('.x')) closePicker(); });
$('#mask').addEventListener('click', e => { if(e.target.id==='mask' || e.target.closest('.x,[data-close]')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') $('#mask2').classList.contains('on') ? closePicker() : closeModal(); });
// 安卓返回键：先关弹窗，再回概览；返回 false 表示退出 App
window.appBack = () => {
  if($('#mask2').classList.contains('on')) { closePicker(); return true; }
  if($('#mask').classList.contains('on')) { closeModal(); return true; }
  if(view!=='home') { go('home'); return true; }
  return false;
};
let narrow = window.innerWidth < 640;
window.addEventListener('resize', () => { const n = window.innerWidth < 640; if(n!==narrow){ narrow = n; render(); } });

let toastTimer;
function toast(msg, btn, fn){
  $('#toastMsg').textContent = msg;
  const b = $('#toastBtn'); b.textContent = btn||''; b.style.display = btn?'':'none';
  b.onclick = () => { fn && fn(); $('#toast').classList.remove('on'); };
  $('#toast').classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('on'), btn?5000:2000);
}
const chips = (name, opts, val, cls) => `<div class="chips ${cls||''}">${opts.map(o => `<label><input type="radio" name="${name}" value="${esc(o)}" ${o===val?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;
const moneyIn = (name, val, ph, extra) => `<div class="money-in"><input name="${name}" type="number" step="0.01" min="0" inputmode="decimal" value="${val||''}" placeholder="${ph||'0'}" ${extra||''}></div>`;
const stepper = (name, val, max) => `<div class="stepper"><button type="button" data-step="-1">−</button><input name="${name}" type="number" min="1" ${max?`max="${max}"`:''} step="1" inputmode="numeric" value="${val}"><button type="button" data-step="1">＋</button></div>`;
function bindSteppers(f){
  f.querySelectorAll('.stepper').forEach(s => s.onclick = e => {
    const b = e.target.closest('[data-step]'); if(!b) return;
    const i = s.querySelector('input'), max = i.max ? +i.max : Infinity;
    i.value = Math.min(max, Math.max(1, (parseInt(i.value)||1) + +b.dataset.step));
    i.dispatchEvent(new Event('input', {bubbles:true}));
  });
}

function normalize(r){
  const n = {id:uid(), name:'', cat:'', qty:1, buyPlat:'', buyDate:today(), buyPrice:0, buyShip:0, chanFee:0, rebate:0, orderNo:'', status:'transit',
    expectPrice:0, sellPlat:'', sellDate:'', sellPrice:0, fee:0, sellShip:0, paid:false, paidDate:'', note:'', created:Date.now(), ...r};
  ['qty','buyPrice','buyShip','chanFee','rebate','expectPrice','sellPrice','fee','sellShip'].forEach(k => n[k] = num(n[k]));
  n.qty = Math.max(1, Math.round(n.qty));
  return n;
}

function openForm(r){
  const isNew = !r || !r.id;
  const last = S.records[S.records.length-1];
  r = normalize(r || {buyPlat: last ? last.buyPlat : S.settings.buyPlats[0], status:'transit'});
  const cats = [...new Set(S.records.map(x => x.cat).filter(Boolean))];
  const hasMore = r.cat || r.orderNo || r.note;
  openModal(`
  <h2>${isNew?'记一单':'编辑货单'}<button class="x" type="button">×</button></h2>
  <form id="rf" autocomplete="off">
    <div class="f name-row"><input name="name" required autocomplete="off" value="${esc(r.name)}" placeholder="商品名称，如：AirPods Pro 2" style="font-size:17px;font-weight:600">
      ${S.records.length?`<button type="button" class="btn soft" id="histBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>历史商品</button>`:''}</div>
    <datalist id="dlCats">${cats.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="f">${chips('buyPlat', S.settings.buyPlats, r.buyPlat)}</div>
    <div class="row">
      <div class="f"><label>买入单价</label><div class="money-in big-in"><input name="buyPrice" type="number" step="0.01" min="0" inputmode="decimal" required value="${r.buyPrice||''}" placeholder="0.00"></div></div>
      <div class="f"><label>数量</label>${stepper('qty', r.qty)}</div>
    </div>
    <div class="row3">
      <div class="f"><label>买入运费</label>${moneyIn('buyShip', r.buyShip)}</div>
      <div class="f"><label>渠道费用</label>${moneyIn('chanFee', r.chanFee, '代拍红包')}</div>
      <div class="f"><label>返利/返现</label>${moneyIn('rebate', r.rebate)}</div>
    </div>
    <div class="row">
      <div class="f"><label>买入日期</label><input name="buyDate" type="date" value="${r.buyDate}" required></div>
      <div class="f"><label>预期售价（单价）</label>${moneyIn('expectPrice', r.expectPrice, '选填')}</div>
    </div>
    <div class="f"><label>状态</label>${chips('status', Object.keys(STATUS).map(k => STATUS[k]), STATUS[r.status])}</div>
    <div class="sec" id="sellSec">
      <div class="f"><label>出货平台</label>${chips('sellPlat', S.settings.sellPlats, r.sellPlat)}</div>
      <div class="row">
        <div class="f"><label>卖出单价</label>${moneyIn('sellPrice', r.sellPrice)}</div>
        <div class="f"><label>卖出日期</label><input name="sellDate" type="date" value="${r.sellDate||today()}"></div>
      </div>
      <div class="row">
        <div class="f"><label>平台手续费</label>${moneyIn('fee', r.fee)}</div>
        <div class="f"><label>卖出运费（自己出）</label>${moneyIn('sellShip', r.sellShip)}</div>
      </div>
      <div class="row">
        <div class="f"><label>货款</label>${chips('paid', ['待到账','已到账'], r.paid?'已到账':'待到账', 'paid')}</div>
        <div class="f" id="paidDateF"><label>到账日期</label><input name="paidDate" type="date" value="${r.paidDate||today()}"></div>
      </div>
    </div>
    <details class="more" ${hasMore?'open':''}><summary>＋ 分类、订单号、备注</summary>
      <div class="row">
        <div class="f"><label>分类</label><input name="cat" list="dlCats" value="${esc(r.cat)}" placeholder="如：数码 / 美妆"></div>
        <div class="f"><label>订单号</label><input name="orderNo" value="${esc(r.orderNo)}" placeholder="选填"></div>
      </div>
      <div class="f"><label>备注</label><input name="note" value="${esc(r.note)}" placeholder="选填，如：用了 20 元券"></div>
    </details>
    <div class="preview" id="pv"></div>
    <div class="foot">
      ${isNew?'<button class="btn" type="submit" name="again" value="1">保存，再记一单</button>':'<button class="btn" type="button" data-close>取消</button>'}
      <button class="btn pri" type="submit">保存</button>
    </div>
  </form>`);
  const f = $('#rf');
  bindSteppers(f);
  const stKey = label => Object.keys(STATUS).find(k => STATUS[k]===label);
  const read = () => {
    const fd = new FormData(f);
    const o = {}; for(const [k,val] of fd) o[k] = typeof val==='string' ? val.trim() : val;
    o.status = stKey(o.status) || 'transit';
    o.paid = o.status==='sold' && o.paid==='已到账';
    if(!o.paid) o.paidDate = '';
    o.buyPlat = o.buyPlat || ''; o.sellPlat = o.sellPlat || '';
    return normalize({...r, ...o, id:r.id, created:r.created});
  };
  const upd = () => {
    const x = read();
    $('#sellSec').style.display = x.status==='sold' ? '' : 'none';
    $('#paidDateF').style.visibility = x.paid ? '' : 'hidden';
    f.sellPrice.required = x.status==='sold';
    const ep = estProfit(x);
    $('#pv').innerHTML = `<div>到手成本<b>${money(cost(x))}</b></div>` + (x.qty>1?`<div>单件成本<b>${money(cost(x)/x.qty)}</b></div>`:'') +
      (x.status==='sold' ? `<div>实收<b>${money(revenue(x))}</b></div><div>利润 ${pct(profit(x)/cost(x))}<b class="${pc(profit(x))}">${money(profit(x),1)}</b></div>`
        : ep!=null ? `<div>预计利润<b class="${pc(ep)}">${money(ep,1)}</b></div>` : '');
  };
  f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
  // 「历史商品」：选一个以前录过的商品，带出名称、上次的平台、价格、分类和预期价
  if($('#histBtn')) $('#histBtn').onclick = () => openHistory(p => {
    f.elements['name'].value = p.name;
    f.buyPrice.value = p.buyPrice || '';
    if(p.cat) f.cat.value = p.cat;
    if(p.expectPrice) f.expectPrice.value = p.expectPrice;
    const bp = f.querySelector(`input[name=buyPlat][value="${CSS.escape(p.buyPlat)}"]`); if(bp) bp.checked = true;
    upd(); setTimeout(() => f.buyPrice.focus(), 50);
  });
  f.onsubmit = e => {
    e.preventDefault();
    const x = read();
    if(!x.name) return toast('请填写商品名称');
    if(x.status!=='sold') Object.assign(x, x.status==='listed' ? {sellDate:'', sellPrice:0, fee:0, sellShip:0} : {sellPlat:'', sellDate:'', sellPrice:0, fee:0, sellShip:0});
    if(x.status!=='sold') Object.assign(x, {paid:false, paidDate:''});
    const i = S.records.findIndex(y => y.id===x.id);
    if(i>=0) S.records[i] = x; else S.records.push(x);
    save();
    if(e.submitter && e.submitter.name==='again'){
      toast(`已保存「${x.name}」，接着记`);
      openForm({buyPlat:x.buyPlat, buyDate:x.buyDate, status:x.status, cat:x.cat});
    } else { closeModal(); toast(isNew?'已记一单 ✅':'已保存'); }
    render();
  };
  if(isNew) setTimeout(() => f.elements['name'].focus(), 250);
}

function openHistory(onPick){
  // 按商品名合并，最近录入的排前面
  const m = new Map();
  [...S.records].sort((a,b) => b.buyDate.localeCompare(a.buyDate) || b.created-a.created).forEach(r => {
    const g = m.get(r.name);
    if(g) { g.n++; g.qty += r.qty; } else m.set(r.name, {last:r, n:1, qty:r.qty});
  });
  const items = [...m.values()];
  $('#modal2').innerHTML = `<h2>选择历史商品 <small class="muted" style="font-size:12px;font-weight:400">${items.length} 个</small><button class="x" type="button">×</button></h2>
    <div class="f search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--sub)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="hq" type="search" autocomplete="off" placeholder="搜索商品" style="padding-left:36px"></div>
    <div class="pick-list" id="hl"></div>`;
  const draw = () => {
    const q = $('#hq').value.trim().toLowerCase();
    const list = items.filter(g => !q || (g.last.name+' '+g.last.cat).toLowerCase().includes(q));
    $('#hl').innerHTML = list.length ? list.map(g => { const r = g.last; return `<div class="pick" data-n="${esc(r.name)}">
      <div class="av b-${r.status}" style="width:38px;height:38px;font-size:15px">${esc([...r.name.trim()][0]||'?')}</div>
      <div class="tx"><div>${esc(r.name)}</div><small>上次 ${esc(r.buyPlat)} ${md(r.buyDate)} · 录过 ${g.n} 次${r.cat?' · '+esc(r.cat):''}</small></div>
      <b class="num">${money(r.buyPrice)}</b></div>`; }).join('') : '<div class="empty">没有找到</div>';
  };
  $('#hq').oninput = draw; draw();
  $('#hl').onclick = e => {
    const el = e.target.closest('.pick'); if(!el) return;
    onPick(m.get(el.dataset.n).last); closePicker();
  };
  $('#mask2').classList.add('on'); requestAnimationFrame(() => $('#mask2').classList.add('show'));
}

function openSell(r){
  const st = S.settings;
  const plat0 = st.sellPlats.includes(st.lastSellPlat) ? st.lastSellPlat : (r.sellPlat || st.sellPlats[0] || '');
  const paid0 = st.paidPref[plat0] ? '已到账' : '待到账';
  openModal(`
  <h2>卖出 · ${esc(r.name)}<button class="x" type="button">×</button></h2>
  <form id="sf">
    <div class="f"><label>出货平台</label>${chips('sellPlat', st.sellPlats, plat0)}</div>
    <div class="row">
      <div class="f"><label>卖出单价</label><div class="money-in big-in"><input name="sellPrice" type="number" step="0.01" min="0" inputmode="decimal" required value="${r.expectPrice||''}" placeholder="0.00"></div></div>
      <div class="f"><label>卖出数量（共 ${r.qty} 件）</label>${stepper('qty', r.qty, r.qty)}</div>
    </div>
    <div class="quick" id="qp" style="margin:-4px 0 12px"></div>
    <div class="row3">
      <div class="f"><label>手续费 <small id="rateTip"></small></label>${moneyIn('fee', '')}</div>
      <div class="f"><label>卖出运费</label>${moneyIn('sellShip', '')}</div>
      <div class="f"><label>卖出日期</label><input name="sellDate" type="date" value="${today()}" required></div>
    </div>
    <div class="f"><label>货款</label>${chips('paid', ['待到账','已到账'], paid0, 'paid')}</div>
    <div class="preview" id="spv"></div>
    <div class="foot"><button class="btn" type="button" data-close>取消</button><button class="btn pri" type="submit">确认卖出</button></div>
  </form>`);
  const f = $('#sf');
  bindSteppers(f);
  let feeTouched = false, paidTouched = false;
  f.fee.addEventListener('input', () => feeTouched = true);
  f.querySelectorAll('input[name=paid]').forEach(i => i.addEventListener('change', () => paidTouched = true));
  f.querySelectorAll('input[name=sellPlat]').forEach(i => i.addEventListener('change', () => {
    if(paidTouched) return;  // 没手动选过的话，按这个平台上次的习惯带出到账状态
    const v = st.paidPref[i.value] ? '已到账' : '待到账';
    f.querySelector(`input[name=paid][value="${v}"]`).checked = true;
  }));
  const calc = () => {
    const fd = new FormData(f);
    const q = Math.min(r.qty, Math.max(1, parseInt(fd.get('qty'))||1));
    const ratio = q / r.qty;
    const plat = fd.get('sellPlat') || '';
    const rate = feeRate(plat);
    const price = num(fd.get('sellPrice'));
    if(!feeTouched) f.fee.value = rate ? r2(price*q*rate) : '';
    $('#rateTip').textContent = rate ? `${r2(rate*100)}%` : '';
    const x = {...r, qty:q, buyShip:r.buyShip*ratio, chanFee:r.chanFee*ratio, rebate:r.rebate*ratio, status:'sold', sellPlat:plat, sellDate:fd.get('sellDate'),
      sellPrice:price, fee:num(f.fee.value), sellShip:num(fd.get('sellShip'))};
    x.paid = fd.get('paid')==='已到账'; x.paidDate = x.paid ? today() : '';
    // 回本单价：卖这个价刚好不亏
    const be = (cost(x) + x.sellShip) / q / (1 - rate || 1);
    return {x, q, be};
  };
  const upd = () => { const {x, be} = calc(); const p = profit(x);
    $('#qp').innerHTML = (r.expectPrice?`<button type="button" data-p="${r.expectPrice}">预期 <b>${money0(r.expectPrice)}</b></button>`:'')
      + `<button type="button" data-p="${r2(be)}">回本价 <b>${money(be)}</b></button>`
      + [1.1,1.2,1.3].map(k => `<button type="button" data-p="${Math.ceil(be*k)}">+${Math.round((k-1)*100)}% <b>${money0(Math.ceil(be*k))}</b></button>`).join('');
    $('#spv').innerHTML = `<div>实收<b>${money(revenue(x))}</b></div><div>成本<b>${money(cost(x))}</b></div>
      <div>利润 ${pct(p/cost(x))}<b class="${pc(p)}">${money(p,1)}</b></div><div>持有<b>${days(r.buyDate, x.sellDate)} 天</b></div>`; };
  $('#qp').onclick = e => { const b = e.target.closest('[data-p]'); if(!b) return; f.sellPrice.value = b.dataset.p; upd(); };
  f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
  f.onsubmit = e => {
    e.preventDefault();
    const {x, q} = calc();
    x.buyShip = r2(x.buyShip); x.chanFee = r2(x.chanFee); x.rebate = r2(x.rebate);
    if(q < r.qty){ // 部分卖出：拆成两条
      x.id = uid(); x.created = Date.now();
      r.qty -= q; r.buyShip = r2(r.buyShip - x.buyShip); r.chanFee = r2(r.chanFee - x.chanFee); r.rebate = r2(r.rebate - x.rebate);
      S.records.push(x);
    } else Object.assign(r, x);
    st.lastSellPlat = x.sellPlat; st.paidPref[x.sellPlat] = x.paid;   // 记住习惯，下次自动选好
    save(); closeModal(); render();
    const p = profit(x);
    toast(`卖出 ${q} 件，${p>=0?'赚':'亏'} ${money(Math.abs(p))} ${p>=0?'🎉':''}`);
  };
  setTimeout(() => f.sellPrice.focus(), 250);
}

    ['始祖鸟 Beta 冲锋衣','服饰',1,'得物',45,3800,0,0,'listed','闲鱼',0,0,0,0],
    ['Labubu 盲盒整盒','潮玩',1,'抖音',3,594,10,0,'transit','',0,0,0,0]

  demo.forEach(([name,cat,qty,buyPlat,bd,buyPrice,buyShip,rebate,status,sellPlat,sd,sellPrice,fee,sellShip]) =>
    S.records.push(normalize({name,cat,qty,buyPlat,buyDate:d(bd),buyPrice,buyShip,rebate,status,sellPlat,sellDate:status==='sold'?d(sd):'',sellPrice,fee,sellShip,paid:status==='sold'&&sd>7,paidDate:status==='sold'&&sd>7?d(sd-3):'',

// 旧数据补上后来新增的字段
function migrate(){
  S.records.forEach(r => {
    if(r.chanFee == null) r.chanFee = 0;
    if(r.paid == null) { r.paid = r.status==='sold'; r.paidDate = r.paid ? r.sellDate : ''; } // 加这个功能前卖出的，默认已到账
  });
  S.settings.paidPref = S.settings.paidPref || {};
}
migrate();
render();
</script>
