<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>玻璃水印相机</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="水印相机">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>
  :root {
    --bg: #000;
    --fg: #f5f6f8;
    --muted: #9a9eab;
    --line: rgba(255, 255, 255, 0.14);
    --surface: rgba(255, 255, 255, 0.08);
    --accent: #ffd60a;
    --accent-ink: #1a1500;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }

  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  /* 玻璃材质（界面按钮用 CSS backdrop-filter） */
  .glass {
    background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.06));
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 6px 20px rgba(0,0,0,0.35);
    -webkit-backdrop-filter: blur(18px) saturate(1.8); backdrop-filter: blur(18px) saturate(1.8);
  }

  .topbar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px; flex: none; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .icon-btn svg { width: 20px; height: 20px; }
  .pill { height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }

  .viewfinder { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: calc(100% - 56px - 190px); margin: 0 auto; overflow: hidden; background: #111; flex: none; }
  .viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .viewfinder video.mirror { transform: scaleX(-1); }
  .vf-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); font-size: 14px; }
  .blink { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
  .blink.on { opacity: 1; transition: none; }

  .live-badge {
    position: absolute; left: 12px; right: 12px; bottom: 12px; height: 50px;
    border-radius: 999px; display: flex; align-items: center; gap: 10px; padding: 0 18px;
    pointer-events: none;
  }
  .bar-area .live-badge { position: static; margin: 10px 14px 0; }
  .live-badge .model { display: flex; align-items: center; gap: 5px; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live-badge .model svg { width: 14px; height: 17px; flex: none; fill: currentColor; }
  .live-badge .spacer { flex: 1; }
  .live-badge .divider { width: 1px; height: 18px; background: rgba(255,255,255,0.35); }
  .live-badge .when { text-align: right; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .live-badge .date { font-weight: 600; font-size: 13px; }
  .live-badge .time { font-size: 10px; opacity: 0.75; }

  .controls { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 18px; padding: 10px 28px 18px; min-height: 0; }
  .shutter-row { display: flex; align-items: center; justify-content: space-between; }
  .side-btn { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; position: relative; overflow: hidden; }
  .side-btn svg { width: 22px; height: 22px; }
  .side-btn input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .shutter { width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 0; display: grid; place-items: center; cursor: pointer; }
  .shutter::after { content: ""; width: 64px; height: 64px; border-radius: 50%; background: #fff; transition: transform 0.12s; }
  .shutter:active::after { transform: scale(0.88); }
  .shutter[disabled] { opacity: 0.4; }

  /* 设置面板 */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 20; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-height: 85%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    border-radius: 22px 22px 0 0; background: rgba(28,28,32,0.92);
    -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
    border-top: 1px solid var(--line);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .sheet .grabber { width: 38px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3); margin: 0 auto 10px; }
  .sheet h2 { font-size: 17px; margin: 0 0 14px; text-align: center; }
  .section-label { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; padding: 14px 14px 6px; }
  .list { border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; padding: 8px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.stack { flex-direction: column; align-items: stretch; gap: 8px; padding-block: 12px; }
  .row label, .row .label { flex: none; }
  select, input[type="text"] { font: 15px var(--font); color: var(--fg); background: transparent; border: 0; text-align: right; min-width: 0; flex: 1 1 auto; max-width: 62%; padding: 6px 0; -webkit-user-select: text; user-select: text; }
  select { appearance: none; -webkit-appearance: none; color: var(--muted); text-align-last: right; }
  select option { color: #000; }
  .segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 12px; background: rgba(255,255,255,0.12); gap: 2px; }
  .segmented button { font-size: 13px; font-weight: 600; border: 0; border-radius: 9px; padding: 8px 6px; background: transparent; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .segmented button[aria-pressed="true"] { background: rgba(255,255,255,0.24); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  .switch { position: relative; width: 51px; height: 31px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,0.18); transition: background 0.2s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
  .switch input:checked + span { background: #34c759; }
  .switch input:checked + span::after { transform: translateX(20px); }
  .sheet .foot { font-size: 12px; color: var(--muted); padding: 8px 14px 0; line-height: 1.5; }

  /* 成片预览 */
  .review { z-index: 10; background: #000; }
  .review .stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 6px 10px; position: relative; }
  .review img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
  .review .bottom { padding: 10px 20px 14px; display: flex; flex-direction: column; gap: 8px; }
  .primary-btn { height: 54px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
  .primary-btn svg { width: 20px; height: 20px; }
  .primary-btn[disabled] { opacity: 0.5; }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin: 0; min-height: 1.4em; }
  .note.ok { color: #34c759; }
  .note.err { color: #ff6b6b; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.25); border-top-color: #fff; animation: spin 0.8s linear infinite; position: absolute; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .review .topbar .segmented { width: 210px; }
</style>
</head>
<body>

<!-- 取景界面 -->
<main class="screen" id="cameraScreen">
  <div class="topbar">
    <button class="icon-btn glass" id="settingsBtn" aria-label="水印设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
    <button class="pill glass" id="styleToggle"></button>
    <button class="icon-btn glass" id="hqBtn" aria-label="系统相机（最高画质）" style="position:relative;overflow:hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><path d="M10 13.5h4M12 11.5v4"/></svg>
      <input id="hqInput" type="file" accept="image/*" capture="environment" style="position:absolute;inset:0;opacity:0">
    </button>
  </div>

  <div class="viewfinder" id="viewfinder">
    <video id="video" playsinline muted autoplay></video>
    <div class="vf-msg" id="vfMsg">正在打开相机…</div>
    <div class="live-badge glass" id="liveBadge"></div>
    <div class="blink" id="blink"></div>
  </div>
  <div class="bar-area" id="barArea"></div>

  <div class="controls">
    <div class="shutter-row">
      <label class="side-btn glass" aria-label="从相册选择">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-9 8"/></svg>
        <input id="libraryInput" type="file" accept="image/*">
      </label>
      <button class="shutter" id="shutter" aria-label="拍照" disabled></button>
      <button class="side-btn glass" id="flipBtn" aria-label="切换前后摄像头">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>
      </button>
    </div>
  </div>
</main>

<!-- 成片 -->
<section class="screen review" id="reviewScreen" hidden>
  <div class="topbar">
    <button class="icon-btn glass" id="closeReview" aria-label="返回拍照">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="segmented" id="reviewStyle">
      <button data-v="floating">悬浮玻璃</button>
      <button data-v="bar">底部玻璃栏</button>
    </div>
  </div>
  <div class="stage">
    <img id="resultImg" alt="加好水印的照片">
    <div class="spinner" id="spinner"></div>
  </div>
  <div class="bottom">
    <button class="primary-btn" id="saveBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
      保存到相册
    </button>
    <p class="note" id="saveNote">也可以长按照片，选“存储到照片”</p>
  </div>
</section>

<!-- 设置 -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="水印设置">
  <div class="grabber"></div>
  <h2>水印设置</h2>
  <div class="section-label">样式</div>
  <div class="segmented" id="styleSeg">
    <button data-v="floating">悬浮玻璃</button>
    <button data-v="bar">底部玻璃栏</button>
  </div>
  <div class="section-label">内容</div>
  <div class="list">
    <div class="row">
      <label for="modelSelect">型号</label>
      <select id="modelSelect"></select>
    </div>
    <div class="row" id="customRow" hidden>
      <label for="customModel">自定义</label>
      <input id="customModel" type="text" placeholder="例如 iPhone 17 Pro" maxlength="40">
    </div>
    <div class="row stack">
      <span class="label">日期格式</span>
      <div class="segmented" id="dateSeg">
        <button data-v="chinese"></button>
        <button data-v="dotted"></button>
        <button data-v="dashed"></button>
      </div>
    </div>
    <div class="row">
      <label for="showTime">显示时分</label>
      <span class="switch"><input id="showTime" type="checkbox"><span></span></span>
    </div>
    <div class="row">
      <label for="showParams">显示拍摄参数</label>
      <span class="switch"><input id="showParams" type="checkbox"><span></span></span>
    </div>
  </div>
  <p class="foot">网页拿不到手机型号，请在上面选一次你的 iPhone，之后会记住。用右上角「系统相机」或相册里的照片时，会优先读取照片里记录的型号和拍摄参数。</p>
</div>

<script src="watermark.js"></script>
<script src="app.js"></script>
</body>
</html>
